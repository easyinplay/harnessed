# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: gsd
  display_name: GSD Core (Git. Ship. Done.)
  description: Project-manager orchestrator providing /gsd-* discuss-plan-execute-verify workflow.
  upstream:
    source: "@opengsd/gsd-core"
    homepage: https://github.com/open-gsd/gsd-core
    repository: https://github.com/open-gsd/gsd-core.git
    license: MIT
    notice: GSD Core (Git. Ship. Done.) by open-gsd, used as orchestration layer in harnessed plan-feature workflow.
spec:
  type: cli-npm
  component_type: command
  category: engineering
  install_type: npm
  install:
    method: npm-cli
    cmd: "npx --yes @opengsd/gsd-core@latest --claude --global"
    npm_version: ^1.7.0
    idempotent_check: "test -d ~/.claude/skills/gsd-plan-phase"
    # 4.23.0 (issue #3 req 5) — gsd-core installs gsd-* prefixed skill dirs only
    # (naturally collision-free with harnessed workflow names); declared empty on
    # purpose so the post-install diff still reports any future unprefixed name.
    installs_skills: []
  verify:
    # Filesystem floor; verifySkillRuntime also checks readable, nonempty resources.
    # Only core phase roles are required, not the optional GSD role catalog.
    cmd: >-
      test -f ~/.claude/skills/gsd-plan-phase/SKILL.md
      && test -f ~/.claude/gsd-core/workflows/discuss-phase.md
      && test -f ~/.claude/gsd-core/workflows/plan-phase.md
      && test -f ~/.claude/gsd-core/workflows/execute-phase.md
      && test -f ~/.claude/gsd-core/workflows/verify-work.md
      && test -f ~/.claude/gsd-core/workflows/progress.md
      && test -f ~/.claude/gsd-core/bin/gsd-tools.cjs
      && test -f ~/.claude/gsd-core/references/ui-brand.md
      && test -f ~/.claude/agents/gsd-phase-researcher.md
      && test -f ~/.claude/agents/gsd-planner.md
      && test -f ~/.claude/agents/gsd-plan-checker.md
      && test -f ~/.claude/agents/gsd-executor.md
      && test -f ~/.claude/agents/gsd-verifier.md
    timeout_ms: 10000
  uninstall:
    cmd: "npx --yes @opengsd/gsd-core@latest --claude --global --uninstall"
    cleanup_paths: []
  # GSD 1.18.0 on Codex installs skills under ~/.agents/skills; retain the legacy
  # ~/.codex/skills path for existing installs. Probe files, not empty directories.
  harness_overrides:
    codex:
      install:
        method: npm-cli
        cmd: "npx --yes @opengsd/gsd-core@latest --codex --global"
        npm_version: ^1.7.0
        idempotent_check: "test -f ~/.agents/skills/gsd-plan-phase/SKILL.md || test -f ~/.codex/skills/gsd-plan-phase/SKILL.md"
      verify:
        # Match the install target without dynamic substitution; custom homes never
        # fall back to resources under ~/.codex. Shared or native legacy skills work.
        cmd: >-
          if test -n "$CODEX_HOME"; then GSD_VERIFY_ROOT="$CODEX_HOME"; else GSD_VERIFY_ROOT="$HOME/.codex"; fi;
          if test -f "$HOME/.agents/skills/gsd-plan-phase/SKILL.md"; then GSD_VERIFY_SKILL="$HOME/.agents/skills/gsd-plan-phase/SKILL.md"; else GSD_VERIFY_SKILL="$GSD_VERIFY_ROOT/skills/gsd-plan-phase/SKILL.md"; fi;
          test -f "$GSD_VERIFY_SKILL" && test -r "$GSD_VERIFY_SKILL" && test -s "$GSD_VERIFY_SKILL" || exit 1;
          for GSD_VERIFY_RESOURCE in
          gsd-core/workflows/discuss-phase.md
          gsd-core/workflows/plan-phase.md
          gsd-core/workflows/execute-phase.md
          gsd-core/workflows/verify-work.md
          gsd-core/workflows/progress.md
          gsd-core/bin/gsd-tools.cjs
          gsd-core/references/ui-brand.md
          agents/gsd-phase-researcher.toml
          agents/gsd-planner.toml
          agents/gsd-plan-checker.toml
          agents/gsd-executor.toml
          agents/gsd-verifier.toml;
          do test -f "$GSD_VERIFY_ROOT/$GSD_VERIFY_RESOURCE" && test -r "$GSD_VERIFY_ROOT/$GSD_VERIFY_RESOURCE" && test -s "$GSD_VERIFY_ROOT/$GSD_VERIFY_RESOURCE" || exit 1; done
        timeout_ms: 10000
      uninstall:
        cmd: "npx --yes @opengsd/gsd-core@latest --codex --global --uninstall"
        cleanup_paths: []
  upstream_health:
    stability: stable
    # 4.32.3 re-sync (2026-07-15) — gsd-core 1.7.0 GA 已发(npm latest=1.7.0,
    # next=1.7.0-rc.6 反成旧)。评估结论:1.7.0 的 host-integration interface
    # (ADR-1239) + destSubpath write-confinement 未改 claude runtime 的写入路径
    # —— 本机 1.7.0 GA 实测 gsd-* 仍装到 ~/.claude/skills/(71 skill,
    # gsd-plan-phase/SKILL.md 在),idempotent_check/verify 假设全部成立。
    # npm_version 基线抬到 ^1.7.0;TODOS watch 项已关。
    last_check: "2026-09-10"
    last_known_good_version: "1.13.0"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
