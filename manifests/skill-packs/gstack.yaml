# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: gstack
  display_name: gstack
  description: Virtual startup team skills (CEO/Eng/Designer/Paranoid Engineer) for governance gates.
  upstream:
    source: gstack
    homepage: https://gstacks.org
    repository: https://github.com/garrytan/gstack.git
    license: MIT
    notice: gstack by Garry Tan, used as governance layer per harnessed plan-feature workflow.
spec:
  type: cc-skill-pack
  component_type: command
  category: engineering
  install_type: git
  install:
    method: git-clone-with-setup
    # v4.14.2 — 上游脚本 setup.sh → setup 改名 + repo 布局改为根级 skill dirs
    # (office-hours/SKILL.md,原 skills/office-hours.md 已不存在;本机 v1.52+ 实证)。
    # clone 保持无 flag 的 `git clone <url> <dest>` 形状 — extractGitCloneTarget
    # 与 git-clone-idempotent 回归测试锁定该相邻性(--single-branch 会使解析错位)。
    cmd: "rm -rf ~/.claude/skills/gstack && git clone https://github.com/garrytan/gstack.git ~/.claude/skills/gstack && cd ~/.claude/skills/gstack && bash ./setup"
    # v4.16.2 — pin bumped to upstream HEAD (was 14fc0866, v1.52 era; force-update
    # dogfood surfaced the drift warn). Per ADR 0037 the pin records install-time
    # last-known-good state — bump on release cadence, not per upstream push.
    # v15.0 re-sync (2026-07-13) — 11de390b → 7c9df1c5 (v1.60.1.0):落差仅 4
    # commits,全部 eval 测试基建,零 skill 面变化(installs_skills 集实证不变)。
    git_ref: 7c9df1c568a9ea745508f679a329332b2c338063
    idempotent_check: "test -d ~/.claude/skills/gstack/.git"
    # 4.23.0 (issue #3 req 5) — upstream root-level skill dirs (v1.58 era,
    # known set). `retro` and `ship` COLLIDE with harnessed's retro workflow /
    # ship master — the post-Step-B integrity pass restores the engine versions.
    installs_skills:
      - office-hours
      - plan-ceo-review
      - plan-eng-review
      - plan-design-review
      - plan-devex-review
      - plan-tune
      - autoplan
      - spec
      - skillify
      - design-consultation
      - design-shotgun
      - design-html
      - design-review
      - devex-review
      - review
      - cso
      - qa
      - qa-only
      - investigate
      - retro
      - health
      - benchmark
      - benchmark-models
      - ship
      - land-and-deploy
      - canary
      - document-release
      - document-generate
      - landing-report
      - browse
      - connect-chrome
      - open-gstack-browser
      - scrape
      - pair-agent
      - setup-deploy
      - setup-browser-cookies
      - setup-gbrain
      - sync-gbrain
      - codex
      - learn
      - context-save
      - context-restore
      - make-pdf
      - careful
      - freeze
      - guard
      - unfreeze
      - gstack-upgrade
  # v4.14.2 — 用户指正: gstack 官方支持 10 agents(README § Other AI Agents),
  # codex 走 `./setup --host codex`,skills 装到 ~/.codex/skills/gstack-*/。
  harness_overrides:
    codex:
      install:
        method: git-clone-with-setup
        # Pin only a fresh clone; preserve an existing checkout and its local edits.
        cmd: "if test ! -e ~/gstack && test ! -L ~/gstack; then git clone https://github.com/garrytan/gstack.git ~/gstack && git -C ~/gstack checkout --detach 514fbfdc9799376edfd2536f60659501a48ead64 ; fi && cd ~/gstack && test -d .git && bash ./setup --host codex"
        git_ref: 514fbfdc9799376edfd2536f60659501a48ead64
        idempotent_check: 'if test -n "$CODEX_HOME"; then GSTACK_VERIFY_ROOT="$CODEX_HOME/skills"; else GSTACK_VERIFY_ROOT="$HOME/.codex/skills"; fi; for GSTACK_VERIFY_SKILL in gstack gstack-office-hours gstack-plan-ceo-review gstack-plan-eng-review gstack-review gstack-qa gstack-browse; do test -f "$GSTACK_VERIFY_ROOT/$GSTACK_VERIFY_SKILL/SKILL.md" && test -r "$GSTACK_VERIFY_ROOT/$GSTACK_VERIFY_SKILL/SKILL.md" || exit 1; done; bash "$GSTACK_VERIFY_ROOT/gstack/bin/gstack-browser-ensure" --check'
      verify:
        # --check launches the installed runtime browser without downloading anything.
        cmd: 'if test -n "$CODEX_HOME"; then GSTACK_VERIFY_ROOT="$CODEX_HOME/skills"; else GSTACK_VERIFY_ROOT="$HOME/.codex/skills"; fi; for GSTACK_VERIFY_SKILL in gstack gstack-office-hours gstack-plan-ceo-review gstack-plan-eng-review gstack-review gstack-qa gstack-browse; do test -f "$GSTACK_VERIFY_ROOT/$GSTACK_VERIFY_SKILL/SKILL.md" && test -r "$GSTACK_VERIFY_ROOT/$GSTACK_VERIFY_SKILL/SKILL.md" || exit 1; done; bash "$GSTACK_VERIFY_ROOT/gstack/bin/gstack-browser-ensure" --check'
        timeout_ms: 60000
  verify:
    cmd: "test -f ~/.claude/skills/gstack/office-hours/SKILL.md"
    timeout_ms: 5000
  uninstall:
    cmd: "rm -rf ~/.claude/skills/gstack"
    cleanup_paths:
      - ~/.claude/skills/gstack
  upstream_health:
    stability: stable
    last_check: "2026-10-23"
    last_known_good_version: "1.91.176.0"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
