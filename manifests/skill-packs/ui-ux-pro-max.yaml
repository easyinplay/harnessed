# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
#
# 4.32.21 — install method changed from `git-clone-with-setup` (self-pack:
# clone midwayjs/midway v4-next, cp .codex/skills/ui-ux-pro-max into
# ~/.claude/skills) to `cc-plugin-marketplace` — the official
# nextlevelbuilder/ui-ux-pro-max-skill plugin supersedes the git self-pack
# (auto-updating, kills the plugin-skill + user-skill dual-load). Third-party
# marketplace ⇒ two-stage cmd (`marketplace add` first); sister
# karpathy-skills.yaml pattern. codex keeps the midway git-clone path via
# harness_overrides (`claude plugin` is a Claude Code-only concept).
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: ui-ux-pro-max
  display_name: ui-ux-pro-max
  description: Data-driven, standards-based UI/UX expert skill, installed as the official ui-ux-pro-max Claude Code plugin.
  upstream:
    # Phase 55 — provenance corrected. These fields had still named
    # midwayjs/midway after the 4.32.21 migration, so the manifest declared an
    # upstream it no longer installs from. `metadata.upstream` names the PRIMARY
    # (Claude Code) source; the midway git-clone survives only as the codex
    # harness_override below, and is documented there.
    source: nextlevelbuilder/ui-ux-pro-max-skill
    homepage: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    repository: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git
    license: MIT
    notice: |
      ui-ux-pro-max skill (MIT), distributed as a Claude Code plugin via the
      nextlevelbuilder/ui-ux-pro-max-skill marketplace (4.32.21 — supersedes
      the git-clone-with-setup self-pack from midwayjs/midway v4-next, which
      dual-loaded next to the plugin). Third-party marketplace ⇒ two-stage
      install (`claude plugin marketplace add` + `claude plugin install`).
      codex installs still use the midway git-clone path (harness_overrides).
spec:
  type: cc-plugin
  component_type: command
  category: design
  install_type: skill
  install:
    method: cc-plugin-marketplace
    cmd: "claude plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill && claude plugin install ui-ux-pro-max@ui-ux-pro-max-skill"
    # Phase 57 (2026-09-10) — CORRECTED to 2.13.0. Phase 55 wrote 2.15.0 from
    # the repo's newest GIT TAG, which is the wrong source for a plugin-channel
    # manifest: `.claude-plugin/marketplace.json` declares 2.13.0, and that is
    # what `claude plugin install` actually resolves (verified — the upgrade on
    # this machine landed on 2.13.0, not 2.15.0). A tag can run ahead of the
    # published marketplace entry, and recording the tag makes the Phase 56
    # doctor check warn "behind" against a version the plugin channel does not
    # serve — an alarm no user can ever clear.
    git_ref: 2.13.0
    idempotent_check: "claude plugin list 2>&1 | grep -qw ui-ux-pro-max"
    marketplace_source:
      source: github
      repo: nextlevelbuilder/ui-ux-pro-max-skill
  verify:
    cmd: "claude plugin list 2>&1 | grep -qw ui-ux-pro-max"
    timeout_ms: 10000
  uninstall:
    cmd: "claude plugin uninstall ui-ux-pro-max@ui-ux-pro-max-skill"
  # v4.14.0 — codex install path unchanged by the 4.32.21 plugin migration:
  # `claude plugin` does not exist on codex, so codex keeps the upstream midway
  # .codex/skills git-clone into shared ~/.agents/skills (codex descriptor
  # skillsDir).
  harness_overrides:
    codex:
      install:
        method: git-clone-with-setup
        cmd: "rm -rf ~/.agents/skills/.cache/midway-uiux && git clone --depth 1 --branch v4-next https://github.com/midwayjs/midway.git ~/.agents/skills/.cache/midway-uiux && mkdir -p ~/.agents/skills && rm -rf ~/.agents/skills/ui-ux-pro-max && cp -R ~/.agents/skills/.cache/midway-uiux/.codex/skills/ui-ux-pro-max ~/.agents/skills/ui-ux-pro-max && rm -rf ~/.agents/skills/.cache/midway-uiux"
        git_ref: e89d70e4bcd0ae04709a773db549cf61fcf813ac
        idempotent_check: "test -f ~/.agents/skills/ui-ux-pro-max/SKILL.md"
      verify:
        cmd: "test -f ~/.agents/skills/ui-ux-pro-max/SKILL.md"
        timeout_ms: 5000
  upstream_health:
    stability: stable
    last_check: "2026-09-10"
    # Phase 57 — the marketplace-declared version, NOT the repo git tag. See the
    # install.git_ref comment above for why the tag is the wrong source here.
    last_known_good_version: "2.13.0"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
  decision_rules:
    trigger: "user 请求 UI/UX 设计 / 前端组件 / design system / 数据驱动可视化"
    default_expert: ui-ux-pro-max
    arbitration_rule: "ui-ux-pro-max 出主方案 (数据驱动 / 标准化); frontend-design 补 layout / 动效 / 装饰细节"
    override_signals:
      - phrase: "做出风格"
        use: frontend-design
      - phrase: "experimental"
        use: frontend-design
      - phrase: "design-led"
        use: frontend-design
    # Phase 2.3 W2 T2.5 — B-17 per-manifest hint 冗余守护层 (SSOT 主导 routing/decision_rules.yaml — D-04)
    do_not_use_when:
      - 做出风格
      - 独创
      - 风格化
      - design-led
    if_rejected_use: frontend-design
