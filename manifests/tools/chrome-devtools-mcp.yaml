# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: chrome-devtools-mcp
  display_name: Chrome DevTools MCP
  description: Performance / a11y / memory-leak diagnostics via Chrome DevTools MCP (LCP / Core Web Vitals / ARIA / heap snapshot).
  upstream:
    source: chrome-devtools-mcp
    homepage: https://github.com/ChromeDevTools/chrome-devtools-mcp
    repository: https://github.com/ChromeDevTools/chrome-devtools-mcp.git
    license: Apache-2.0
    notice: |
      chrome-devtools-mcp by ChromeDevTools team (Apache-2.0), distributed as
      a Claude Code plugin via the BUILT-IN claude-plugins-official marketplace
      (4.32.21 — supersedes the mcp-stdio-add install pinning npm ^0.1.0; the
      official plugin auto-updates + fuller toolset).
      ECC bundles a same-name connector by default — ecc users set
      ECC_DISABLED_MCPS=chrome-devtools at ECC install/sync to avoid a duplicate.
      testing category — perf / a11y / memory-leak (`perf-a11y-memory` rule).
spec:
  type: cc-plugin
  component_type: mcp-tool
  category: testing
  install_type: skill
  install:
    method: cc-plugin-marketplace
    cmd: "claude plugin install chrome-devtools-mcp@claude-plugins-official"
    git_ref: 1.6.0
    idempotent_check: "claude plugin list 2>&1 | grep -qw chrome-devtools-mcp"
  verify:
    cmd: "claude plugin list 2>&1 | grep -qw chrome-devtools-mcp"
    timeout_ms: 10000
  uninstall:
    cmd: "claude plugin uninstall chrome-devtools-mcp@claude-plugins-official"
  # 4.32.21 — codex has no claude plugin ecosystem; without an override the
  # cc-plugin-marketplace method hits the CLAUDE_ONLY_METHODS harness-mismatch
  # gate (regression vs the pre-4.32.21 mcp-stdio-add manifest, which installed
  # fine on codex via the installer's internal platform routing). Keep codex on
  # the npm stdio MCP path (^1.6.0 — npm latest, also unpins the old ^0.1.0);
  # cmd stays claude-shaped, the mcpStdioAdd codex arm translates it.
  harness_overrides:
    codex:
      install:
        method: mcp-stdio-add
        cmd: "claude mcp add --scope project --transport stdio chrome-devtools-mcp -- npx --yes chrome-devtools-mcp@^1.6.0"
        npm_version: ^1.6.0
        idempotent_check: "claude mcp list | grep -q chrome-devtools-mcp"
      verify:
        cmd: "claude mcp list | grep -q chrome-devtools-mcp"
        timeout_ms: 10000
  upstream_health:
    stability: stable
    last_check: "2026-07-29"
    last_known_good_version: "1.6.0"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
  decision_rules:
    trigger: "perf / a11y / memory-leak / LCP / Core Web Vitals"
    default_expert: chrome-devtools-mcp
