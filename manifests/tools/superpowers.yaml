# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
#
# NOTE: spec.install.cmd is a Claude Code REPL slash command, NOT a shell command.
# cc-plugin-marketplace install method's actual mechanism is undefined for
# headless installer execution. See progress.md § B F20.
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: superpowers
  display_name: superpowers
  description: Senior-engineer skill plugin (brainstorming, TDD, git worktrees) auto-activated by Claude.
  upstream:
    source: superpowers
    homepage: https://github.com/obra/superpowers
    repository: https://github.com/obra/superpowers.git
    license: MIT
    notice: superpowers by Jesse Vincent (obra) and Prime Radiant team, used as execution-layer engineering quality skills.
spec:
  type: cc-plugin
  component_type: command
  category: engineering
  install_type: skill
  install:
    method: cc-plugin-marketplace
    cmd: "/plugin marketplace add obra/superpowers-marketplace && /plugin install superpowers@superpowers-marketplace"
    # v15.0 re-sync (2026-07-13) — v6.0.3 → v6.1.1:v6.1.0 using-superpowers
    # bootstrap token 压缩(每 session 固定成本下降)+ Codex marketplace 安装;
    # v6.1.1 Codex `hooks: {}` 修复(不再误注册 Claude SessionStart hook)。
    # Gemini CLI 支持上游移除(Google EOL)— harnessed 无 gemini 平台面,无涉。
    git_ref: v6.1.1
    idempotent_check: "/plugin list | grep -q superpowers"
  verify:
    cmd: "/plugin list | grep -q superpowers"
    timeout_ms: 5000
  uninstall:
    cmd: "/plugin uninstall superpowers@superpowers-marketplace"
  # v4.14.0 — codex install path (findings 附录实证: obra/superpowers README 官方
  # 支持 Codex CLI;superpowers 在 codex 预置 marketplace 中 → 单步 `codex plugin add`,
  # 无需 marketplace add)。
  # 2026-09-16 (Phase 62) — the preset marketplace is now `openai-api-curated`.
  # Host-verified on codex-cli 0.154.0: `codex plugin add superpowers@openai-curated`
  # fails ("plugin `superpowers` was not found in marketplace `openai-curated`");
  # `@openai-api-curated` installs and registers `[plugins."superpowers@openai-api-curated"]`.
  # The checks match the STATUS column: `codex plugin list` also prints plugins that
  # are NOT installed, so a bare name search is a false positive.
  harness_overrides:
    codex:
      install:
        method: cc-plugin-marketplace
        cmd: "codex plugin add superpowers@openai-api-curated"
        git_ref: v6.1.1
        idempotent_check: "codex plugin list | grep -qE 'superpowers@openai-api-curated +installed'"
      verify:
        cmd: "codex plugin list | grep -qE 'superpowers@openai-api-curated +installed'"
        timeout_ms: 15000
  upstream_health:
    stability: stable
    last_check: "2026-09-10"
    last_known_good_version: "6.3.0"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
