# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: playwright-cli
  display_name: Playwright CLI Runtime
  description: Global browser automation CLI and Chromium runtime; not the project-level @playwright/test runner.
  upstream:
    source: "@playwright/cli"
    homepage: https://github.com/microsoft/playwright-cli
    repository: https://github.com/microsoft/playwright-cli.git
    license: Apache-2.0
    notice: Microsoft Playwright CLI runtime, separate from the playwright-test browser automation skill and project-level test dependencies.
spec:
  type: cli-npm
  component_type: cli-binary
  category: testing
  install_type: npm
  install:
    method: npm-cli
    cmd: "npm install -g @playwright/cli@0.1.22 && playwright-cli install-browser chromium"
    npm_version: "0.1.22"
    idempotent_check: "playwright-cli --version | grep -Fx '0.1.22'"
  verify:
    # npm-cli runs this in neutralCwd, outside the user's project.
    # Read-only metadata verification; never start a browser or daemon here.
    cmd: |
      node -e '
      const spawnSync = require("node:child_process").spawnSync;
      function run(args) {
        const windows = process.platform === "win32";
        const result = spawnSync(windows ? process.env.COMSPEC || "cmd.exe" : "playwright-cli", windows ? ["/d", "/s", "/c", "playwright-cli", ...args] : args, { encoding: "utf8", windowsHide: true, shell: false, stdio: ["ignore", "pipe", "pipe"], timeout: 15000, maxBuffer: 262144, env: { ...process.env, NO_UPDATE_NOTIFIER: "1" } });
        if (result.error) throw result.error;
        process.stdout.write(result.stdout);
        process.stderr.write(result.stderr);
        if (result.status !== 0) process.exit(result.status || 1);
        if (/^### Error/m.test(result.stdout)) throw new Error("Playwright CLI reported an error");
        return result.stdout;
      }
      if (run(["--version"]).trim() !== "0.1.22") throw new Error("Expected playwright-cli 0.1.22");
      const dryRun = run(["install-browser", "chromium", "--dry-run"]);
      if (!/\(playwright chromium v\d+\)/.test(dryRun) || !/^\s*Install location:\s*\S.*$/m.test(dryRun)) throw new Error("Chromium installation metadata is missing");
      const listed = run(["install-browser", "chromium", "--list"]);
      const installed = listed.split(/(?=^Playwright version:\s*\S)/m).some(block => {
        if (!/^Playwright version:\s*\S/.test(block)) return false;
        let section = "";
        let chromium = false;
        let cli = false;
        for (const line of block.split(/\r?\n/)) {
          if (/^\s*Browsers:\s*$/.test(line)) section = "browsers";
          else if (/^\s*References:\s*$/.test(line)) section = "references";
          else if (/^\s*[A-Za-z][A-Za-z ]*:\s*$/.test(line)) section = "";
          else if (section === "browsers" && /(?:^|[\/\x5c])chromium-\d+(?=$|[\/\x5c\s])/.test(line)) chromium = true;
          else if (section === "references" && /(?:^|[\/\x5c])@playwright[\/\x5c]cli(?=$|[\/\x5c\s])/.test(line)) cli = true;
        }
        return chromium && cli;
      });
      if (!installed) throw new Error("No installed Chromium browser reference from @playwright/cli");
      '
    timeout_ms: 60000
    expected_exit_code: 0
  uninstall:
    cmd: "npm uninstall -g @playwright/cli"
  upstream_health:
    stability: unstable
    last_check: "2026-10-23"
    last_known_good_version: "0.1.22"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
