# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: webapp-testing
  display_name: Anthropic Webapp Testing Skill
  description: Anthropic browser testing skill and server helper; Python Playwright remains a project-level dependency.
  upstream:
    source: github.com/anthropics/skills
    homepage: https://github.com/anthropics/skills/tree/main/skills/webapp-testing
    repository: https://github.com/anthropics/skills.git
    license: anthropics-official
    license_source: anthropics-official
    notice: |
      Official anthropics/skills webapp-testing skill; license provenance uses the schema anthropics-official carve-out.
      L2 installs only the skill and scripts/with_server.py, independently of gstack.
      Setup verifies readable nonempty same-root resources without executing Python.
      Python and Playwright are runtime/project prerequisites, not installed by setup. Python Playwright is a project-level dependency; no pip install, browser download or project package changes.
spec:
  type: cc-skill-pack
  component_type: command
  category: testing
  install_type: skill
  install:
    method: npx-skill-installer
    cmd: "npx --yes skills@latest add anthropics/skills --skill webapp-testing --copy --global -y"
    npm_version: ^1.7.4
    idempotent_check: "test -r ~/.agents/skills/webapp-testing/SKILL.md || test -r ~/.codex/skills/webapp-testing/SKILL.md || test -r ~/.claude/skills/webapp-testing/SKILL.md"
    installs_skills:
      - webapp-testing
  verify:
    cmd: |
      node -e '
      const fs = require("node:fs");
      const path = require("node:path");
      const home = require("node:os").homedir();
      const platform = process.env.HARNESSED_PLATFORM;
      const codex = platform ? platform === "codex" : Boolean(process.env.CODEX_HOME || process.env.CODEX_SESSION_ID);
      const codexHome = path.resolve(process.env.CODEX_HOME || path.join(home, ".codex"));
      const roots = codex
        ? [path.join(home, ".agents", "skills", "webapp-testing"), path.join(codexHome, "skills", "webapp-testing")]
        : [".agents", ".codex", ".claude"].map(dir => path.join(home, dir, "skills", "webapp-testing"));
      const root = roots.find(dir => fs.existsSync(path.join(dir, "SKILL.md")));
      if (!root) throw new Error("webapp-testing SKILL.md is missing");
      for (const resource of ["SKILL.md", "scripts/with_server.py"]) {
        const file = path.join(root, resource);
        fs.accessSync(file, fs.constants.R_OK);
        const info = fs.statSync(file);
        if (!info.isFile() || info.size === 0) throw new Error("Required resource is empty or not a file: " + file);
      }
      '
    timeout_ms: 30000
    expected_exit_code: 0
  uninstall:
    cmd: "rm -rf ~/.claude/skills/webapp-testing"
    cleanup_paths:
      - ~/.claude/skills/webapp-testing
  upstream_health:
    stability: stable
    last_check: "2026-10-23"
    last_known_good_version: "1.7.4"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
