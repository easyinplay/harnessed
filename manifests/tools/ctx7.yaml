# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: ctx7
  display_name: ctx7 CLI
  description: Up-to-date library / framework documentation fetcher (Upstash). Bash CLI, two-step library + docs.
  upstream:
    source: ctx7
    homepage: https://context7.com
    repository: https://github.com/upstash/context7.git
    license: MIT
    notice: ctx7 by Upstash (official), used as on-demand library doc retriever in harnessed plan-feature workflow.
spec:
  type: cli-npm
  component_type: cli-binary
  category: search
  install_type: npm
  install:
    method: npm-cli
    cmd: "npm install -g ctx7"
    # Phase 55 (2026-09-10) — ^0.4.0 did not even cover the current upstream
    # (0.5.11): a caret range on a 0.x major is minor-locked. The install cmd is
    # unversioned `npm install -g ctx7`, so users were always getting 0.5.x while
    # the record claimed a range that excludes it.
    npm_version: ^0.5.0
    idempotent_check: "command -v ctx7"
  verify:
    cmd: "ctx7 --version"
    timeout_ms: 5000
    expected_exit_code: 0
  uninstall:
    cmd: "npm uninstall -g ctx7"
  upstream_health:
    stability: stable
    last_check: "2026-09-10"
    last_known_good_version: "0.5.11"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
