# yaml-language-server: $schema=../../schemas/manifest.v1.schema.json
#
# 4.32.22 FINAL — BONUS TIER (manifests/optional/, user ruling; the interim
# base-promotion was withdrawn after empirical study). Findings: ECC 2.1.0
# conflict matrix shows ZERO breaking-level conflicts, but its static listing
# tax measures ≈23-25k tokens/session — driven by ECC's own scale (281 skills /
# 94 commands / 67 agents loaded into every session listing), NOT by harnessed;
# and its hook surface drifts across upstream upgrades. Ruling: harnessed does
# not carry ECC's install/friction responsibility — but when ECC is present in
# the environment, capabilities.yaml Bucket 11 + verify aliases light up
# finer-grained orchestration (per-language review/build expert routing etc.).
# `harnessed setup` surfaces it via the optional-tier offer with an INFORMED
# note (value + token cost); doctor `ecc` check: missing on both harnesses →
# pass-informational (optional enhancement, not a health gap); ecc + leftover
# chrome-devtools channel (official plugin or stdio mcpServers entry) → warn
# dual-install (ECC bundles the same-name connector; see
# manifests/optional/chrome-devtools-mcp.yaml — the two are either/or).
# Friction tuning: GATEGUARD_EXEMPT_GLOBS (written by `harnessed
# exempt-gateguard`) or ECC_GATEGUARD=off moderates the opinionated hooks.
#
# ECC (Affaan Mustafa) selective assimilation — A posture per ADR-0034.
# ECC is a near-complete PARALLEL stack (its own plan/execute/review/learn/
# checkpoint/multi-agent). harnessed does NOT wire that; it assimilates ONLY the
# additive zones (domain-pattern starter-set ≤8 + cost-report/model-route +
# hookify) and收编s per-language reviewers/build-resolvers as verify-dimension
# aliases. checkpoint/ledger/compact/learning families are HARD-EXCLUDED (keystone
# engine collision, same rationale as gsd-execute-phase).
#
# De-confliction matrix SoT: docs/adr/0034-ecc-assimilation-deconfliction.md
# EE-5 gate record:           manifests/optional/ecc.ee5-answers.json (record
#                             stays in optional/ as an immutable audit artifact)
apiVersion: harnessed/v1
kind: Manifest
metadata:
  name: ecc
  display_name: ECC (bonus tier — unlocks finer-grained orchestration)
  description: "ECC bonus tier: unlocks finer orchestration (ecc:* expert routing); costs ~20k+ tokens/session listing (ECC-side)."
  upstream:
    source: github.com/affaan-m/ECC
    homepage: https://ecc.tools
    repository: https://github.com/affaan-m/ECC.git
    license: MIT
    notice: |
      ECC (Engineering Claude Code) by Affaan Mustafa, via the `ecc` CC
      marketplace. Bonus tier: installing it lights up finer-grained
      orchestration (per-language review/build expert routing etc.). Cost:
      ~20k+ tokens/session static listing overhead — inherent to ECC's own
      scale (281 skills / 94 commands / 67 agents), NOT introduced by
      harnessed. Opinionated hooks (gateguard) are tunable via
      GATEGUARD_EXEMPT_GLOBS (`harnessed exempt-gateguard`) or ECC_GATEGUARD=off.
spec:
  type: cc-plugin
  component_type: command
  category: engineering
  install_type: skill
  install:
    method: cc-plugin-marketplace
    cmd: "claude plugin marketplace add affaan-m/ECC && claude plugin install ecc@ecc"
    git_ref: ec92b528471df708c2384ebbcc82b390b60f535a
    idempotent_check: "claude plugin list 2>&1 | grep -qw ecc"
    marketplace_source:
      source: github
      repo: affaan-m/ECC
  verify:
    cmd: "claude plugin list 2>&1 | grep -qw ecc"
    timeout_ms: 10000
  uninstall:
    cmd: "claude plugin uninstall ecc@ecc"
  # Phase 57 (2026-09-10) — codex channel switched from the sync script to the
  # NATIVE codex plugin. Upstream flipped its recommendation between 2.0 and 2.2;
  # the 4.32.21 comment here ("codex marketplace route is experimental and NOT
  # recommended upstream") is now the opposite of what the README says:
  #
  #   "The older `scripts/sync-ecc-to-codex.sh` path is a deprecated
  #    compatibility option for users who intentionally need copied and merged
  #    configuration in ~/.codex; it is not required for the native plugin."
  #
  # The native route is also strictly better for harnessed's contract: the sync
  # script's idempotent/verify checks could only probe the kept clone cache, NOT
  # the ~/.codex merge state (that flow has no stable pinned artifact), whereas
  # `codex plugin list` is a real registry query. Both `codex plugin` add
  # commands are idempotent per upstream.
  #
  # Method stays cc-plugin-marketplace: src/installers/ccPluginMarketplace.ts
  # already dispatches on platform (`bin === 'codex'` → `plugin add`, no
  # `--scope` — codex has one plugin state per CODEX_HOME, not Claude's three
  # scopes) and parses the two-stage form. Sister precedent: the codex override
  # in manifests/tools/superpowers.yaml.
  #
  # MIGRATION HAZARD, upstream verbatim: "Do not add the native marketplace
  # plugin on top of the sync flow." A user who ran the pre-Phase-57 codex
  # install has the legacy layer in ~/.codex and must strip it FIRST with
  # upstream's own tool — `node scripts/ecc.js uninstall --legacy-codex-sync`
  # (add --dry-run to preview). harnessed cannot do this for them: the sync
  # merged files it does not own. The uninstall cmd below therefore removes only
  # what the native path creates.
  # Prerequisite unchanged: run Codex once so ~/.codex/config.toml exists.
  harness_overrides:
    codex:
      install:
        method: cc-plugin-marketplace
        cmd: "codex plugin marketplace add affaan-m/ECC && codex plugin add ecc@ecc"
        git_ref: ec92b528471df708c2384ebbcc82b390b60f535a
        idempotent_check: "codex plugin list 2>&1 | grep -qw ecc"
      verify:
        cmd: "codex plugin list 2>&1 | grep -qw ecc"
        timeout_ms: 15000
      # NOTE: the schema's HarnessOverride allows only `install` and `verify`
      # (additionalProperties: false), so uninstall cannot be overridden per
      # harness. `spec.uninstall` below stays claude-flavoured; on codex the
      # correct command is `codex plugin remove ecc@ecc`. Pre-existing gap — the
      # old sync-flow override had no uninstall either — recorded here rather
      # than widening the schema for one manifest.
  upstream_health:
    stability: unstable
    # Phase 57 (2026-09-10) — Phase 55's open item RESOLVED by reading the
    # upstream README instead of the release notes. The guided installer does NOT
    # supersede the CC path; upstream says so directly:
    #
    #   "Both paths install the same `ecc@ecc` plugin. Choose one and do not
    #    stack another manual Claude install on top."
    #
    # and lists the native plugin commands under "Also supported for Claude
    # Code", with "Claude Code plugin + the legacy Codex sync flow" under
    # "Works". So switching the CC channel to `npx ecc-universal install
    # --guided` would install the identical artifact while trading a
    # deterministic two-stage command for an interactive "reviewed flow" — fatal
    # for harnessed's non-interactive spawn (sister: the `-y` flags the skills
    # CLI needed for exactly this reason). CC path therefore UNCHANGED.
    #
    # The codex channel DID change — see harness_overrides above. That is where
    # upstream actually moved: the sync script is now deprecated in favour of the
    # native codex plugin.
    last_check: "2026-09-10"
    last_known_good_version: "2.2.1"
    fallback_action: warn
  signed_by: easyinplay
  platforms:
    - linux
    - darwin
    - win32
