# harnessed v3.0 workflow defaults
# Phase v2.0-2.3 W1.2 ship — ralph_max_iterations table per R20.10 + D-10 fallback abort path
#   (legacy key name retained on purpose — see the note above the table below)
# Phase v3.0-3.4 W2.2 extend — 18 v3 sub-workflow + retro standalone × phase entries
# Sister Phase 2.2 STRIDE T-2.2-05 DoS mitigation: hard_upper_limit = 100 caps any user override
# Phase 2.4 workflow.yaml v2 interpolation: {{ defaults.ralph_max_iterations.<workflow>.<phase> }}

schema_version: harnessed.defaults.v1

# Per-workflow per-phase attempt ceiling (completion guarantee vs DoS prevention;
# sister ADR 0011 SDK pattern)
# 4.36.0 — the upstream ralph-loop plugin dependency is gone, but this key keeps its
# LEGACY NAME deliberately: it is read by exact string in src/checkpoint/budget.ts
# (resolveAttemptBudget) and interpolated by name from workflow yaml
# (`{{ defaults.ralph_max_iterations.<workflow>.<phase> }}`). A rename buys nothing
# user-visible and risks a silent lookup miss. Do NOT rename.
ralph_max_iterations:
  # v3 standalone (research v3 schema bump + retro NEW per Phase 3.4 W1.1+W1.2)
  research:
    # 5 个 fan-out phase 共用同一预算。曾写作单个 `01-fan-out` 前缀键,但查表按
    # phase id 精确匹配 (Phase 54 T0),前缀键匹配不到任何 phase → 全落默认 20。
    01-fan-out-tavily-keyword: 3
    01-fan-out-exa-descriptive: 3
    01-fan-out-tavily-crawl: 3
    01-fan-out-ctx7-lib-docs: 3
    01-fan-out-webfetch-url: 3
    02-synth: 3

  retro:
    01-retro: 3
    02-persist: 3

  # v3 sub-workflow — discuss stage (3 sub per Phase 3.4 W0.1-W0.3)
  discuss-strategic:
    01-office-hours: 5
    02-plan-ceo-review: 3

  discuss-phase:
    01-gsd-discuss: 5

  discuss-subtask:
    01-brainstorm: 5

  # v3 sub-workflow — plan stage (2 sub per Phase 3.4 W0.4-W0.5)
  plan-architecture:
    01-plan-eng-review: 3

  plan-phase:
    01-gsd-plan: 5
    02-persist: 5

  # v3 sub-workflow — task stage (4 sub per Phase 3.4 W0.6-W0.9)
  task-clarify:
    01-brainstorm: 5

  task-code:
    01-code: 20

  task-test:
    01-test: 15

  task-deliver:
    01-deliver: 20

  # v3 sub-workflow — verify stage (8 sub per Phase 3.4 W0.10-W0.13a-e)
  verify-progress:
    01-gsd-verify-work: 3
    02-gsd-progress: 3
    03-progress-update: 3

  verify-code-review:
    01-code-review: 5

  verify-paranoid:
    01-review: 3

  verify-qa:
    01-qa: 3

  verify-security:
    01-cso: 3

  verify-design:
    01-design-review: 3

  verify-second-opinion:
    # 第二意见跑一次就该有结论;循环重跑只会稀释它的独立性。
    01-second-opinion: 2

  verify-simplify:
    01-simplify: 5

  verify-multispec:
    01-team-create: 1
    02-team-cleanup: 1

# Hard upper limit — workflow engine rejects any user override > this value
# Sister Phase 2.2 STRIDE T-2.2-05 DoS mitigation
hard_upper_limit: 100
