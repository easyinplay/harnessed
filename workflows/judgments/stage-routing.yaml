# workflows/judgments/stage-routing.yaml
# Master orchestrator sub-stage delegation per D-01
# 4 master (/discuss /plan /task /verify) auto gate-eval 触发 sub conditional
# Sister: 3 strategic/phase/subtask gate 已 SHIPPED 独立判断, 本 file orchestrator-level routing
#
# Phase v3.0-3.2 Wave A RESEARCH → 3.3 W0.3 ship per D-11 + D-01
#
# expr-eval 2.0.2 case-sensitive: keyword `and` / `or` 全小写

schema_version: harnessed.judgment.v1

triggers:
  # discuss-strategic-delegate MOVED to judgments/strategic-gate.yaml as
  # `strategic-tier-delegate` — verbatim expression, zero behaviour change. It was
  # not a copy but the UNION of that file's two triggers, so it could not simply be
  # deleted in favour of one of them (either choice drops arms). Relocating it
  # beside its two members is what makes a future drift visible: adding an arm to
  # `office-hours` now sits one screenful from the union that must learn it too.
  #
  # discuss-phase-delegate / discuss-subtask-delegate REMOVED — they were verbatim
  # copies of judgments/phase-gate.yaml `gsd-discuss-phase` and
  # judgments/subtask-gate.yaml `brainstorming`, and the copies were what
  # workflows/discuss/auto/workflow.yaml actually evaluated. The phase copy had
  # already drifted: the `phase.files_touched > 5` scope arm was added to
  # phase-gate.yaml but never to the copy, so the criterion could not change any
  # master-tier decision. The master now gates directly on the canonical triggers
  # (gate refs are cross-file — judgments.<file>.<trigger>.fires resolves any
  # judgments/*.yaml). Guard: tests/workflow/judgment-expression-dedup.test.ts.

  # /plan master → 2 sub serial
  plan-architecture-delegate:
    description: /plan master → /plan-architecture 委派 fire 当复杂架构 (gstack /plan-eng-review)。
    fires_when: "phase.is_complex_architecture == true"
    invokes:
      - capability: plan-eng-review

  plan-phase-delegate:
    description: /plan master → /plan-phase 委派总是 fire (GSD plan-phase + planning-with-files)。
    fires_when: "phase.stage == 'plan'"
    invokes:
      - capability: gsd-plan-phase
      - capability: planning-with-files

  # /verify master → 5-7 sub conditional
  verify-progress-always:
    description: /verify master → /verify-progress 总 fire (GSD verify + progress)。
    fires_when: "phase.stage == 'verify'"
    invokes:
      - capability: gsd-verify-work
      - capability: gsd-progress

  verify-paranoid-critical:
    description: /verify master → /verify-paranoid fire 当 critical_module。
    fires_when: "phase.stage == 'verify' and phase.is_critical_module == true"
    invokes:
      - capability: gstack-review

  verify-qa-ui:
    description: /verify master → /verify-qa fire 当 has_ui_changes。
    fires_when: "phase.stage == 'verify' and phase.has_ui_changes == true"
    invokes:
      - capability: gstack-qa

  verify-security-secrets:
    description: /verify master → /verify-security fire 当 has_auth_or_secrets。
    fires_when: "phase.stage == 'verify' and phase.has_auth_or_secrets == true"
    invokes:
      - capability: gstack-cso

  # verify-design-changes REMOVED — verbatim copy of
  # judgments/web-design-routing.yaml `design-review-post`, which T2.3 already
  # made the canonical home (workflows/verify/design/workflow.yaml gates on it).
  # workflows/verify/auto/workflow.yaml now delegates on the same canonical
  # trigger; predicate is unchanged, so behaviour is identical.

  verify-eval-review-aiphase:
    description: /verify master → /verify-eval-review fire 当 has_ai_phase (AI phase eval 覆盖审计)。
    fires_when: "phase.stage == 'verify' and phase.has_ai_phase == true"
    invokes:
      - capability: gsd-eval-review

  verify-validate-phase-coverage:
    description: /verify master → /verify-validate-phase fire 当 requires_coverage_audit (Nyquist 覆盖查漏)。
    fires_when: "phase.stage == 'verify' and phase.requires_coverage_audit == true"
    invokes:
      - capability: gsd-validate-phase

  verify-multispec-critical-release:
    description: |
      /verify master → /verify-multispec 4-specialist Agent Team Pattern C fire
      当 critical release。
    fires_when: "phase.stage == 'verify' and is_critical_release == true"
    invokes:
      - capability: agent-teams-create

  verify-simplify-tail:
    description: /verify master → /verify-simplify 末尾 (code-simplifier)。
    fires_when: "phase.stage == 'verify' and phase.is_final_step == true"
    invokes:
      - capability: code-simplifier

  # Phase 21 NEW — Stage ⑤ Ship master → ship-preflight always (release-readiness gate)
  ship-preflight-always:
    description: /ship master → /ship-preflight 总 fire (read-only release-readiness gate)。
    fires_when: "phase.stage == 'ship'"
    invokes:
      - capability: release-preflight

  # v3.2.0 NEW — /auto super-master Phase 0.5 understanding check gate
  auto-research-unclear:
    description: |
      /auto super-master → /research conditional spawn 当 user_understanding_unclear == true
      (Phase 0.5 understanding check prompt n → ctx fact set)。sister CLAUDE.md research routing。
    fires_when: "user_understanding_unclear == true"
    invokes:
      - capability: tavily-mcp
      - capability: exa-mcp
      - capability: ctx7
