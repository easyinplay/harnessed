# workflows/judgments/web-testing-routing.yaml
# Bundled routing rule: 三层职责矩阵 (脑 @playwright/test / 手 playwright-cli / 筋骨 webapp-testing) + 决策树
# Phase v3.0-3.2 Wave A RESEARCH → 3.3 W0.3 ship per D-11
#
# 三层职责矩阵 verbatim:
#   脑 (写测试 / 跑 CI)         — @playwright/test (frontend/e2e/*.spec.ts)
#   手 (AI 实时操作)            — /browse 主导 (gstack headless Playwright);
#                                 未装 gstack 降级 playwright-cli (一行 Bash, token 最省)
#   筋骨 (Python 后端联动)      — webapp-testing skill (tests/e2e/*.py)
#   非功能性诊断 (性能/a11y/内存) — chrome-devtools-mcp (有 provider 时必用;
#                                 ecc / 自装 manifest 二选一, 两者都缺则该 lane 不 fire)
#
# T2.3 — 本 file 的 4 trigger 之前是运行时孤儿 (零 gate ref → resolveJudgmentGate
# 纯 ref 驱动, 永不加载求值)。现由 workflows/verify/qa/workflow.yaml 的 4 条 lane
# phase 各接一个 gate。手层 trigger 由 playwright-cli-probe 改名 browse-probe:
# 浏览器探查偏好 /browse (token 高效, 可复用 cookies 与会话状态)。
# 这是路由偏好, NOT deny-list — 不禁用任何浏览器工具。
#
# expr-eval 2.0.2 case-sensitive: keyword `and` / `or` 全小写 (sister Phase 2.3 W0.2 bug)

schema_version: harnessed.judgment.v1

triggers:
  playwright-test-default:
    description: |
      @playwright/test — 默认 CI 提交进 repo 的正式 E2E test framework,
      前端 TypeScript / React / Vue, 只需浏览器操作 + HTTP API setup。
      Path frontend/e2e/*.spec.ts; cmd npx playwright test。
    fires_when: "subtask.test_type == 'ci-commit'"
    skips_when: "subtask.test_type in ['probe', 'python-backend', 'perf-diagnostic']"
    invokes:
      - capability: playwright-test

  browse-probe:
    description: |
      浏览器探查 / 调试 / 一次性确认 (非提交 repo) — 主导 /browse。
      探查产出的 selectors 再沉淀到正式 test (playwright-test-default lane)。
      Provider 说明 (降级链, 同下方 chrome-devtools 二选一注记体例):
      首选 browse (gstack user-skill, capabilities.yaml browse — headless Playwright,
      token 高效, 可复用 cookies 与会话状态) → 未装 gstack 时本 capability 不可用,
      降级 playwright-cli (npm-cli, 无 gstack 依赖, 仍在 tools_available 内) →
      两者都缺时用 harness 平台内置浏览器工具。
      路由偏好而非 deny-list: 只表达优先级, 不禁用任何浏览器工具。
    fires_when: "subtask.test_type == 'probe' or subtask.needs_browser_automation == true"
    invokes:
      - capability: browse

  webapp-testing-python-backend:
    description: |
      webapp-testing skill — Python 后端联动特例
      (要 import Tortoise ORM / pandas / backend utils OR 前端是 Python 模板 Django Jinja)。
      Path tests/e2e/*.py; with_server.py 双进程。
    fires_when: "subtask.test_type == 'python-backend'"
    invokes:
      - capability: webapp-testing

  chrome-devtools-mcp-diagnostic:
    description: |
      chrome-devtools-mcp — 非功能性诊断在 provider 在场时必须用它
      (NOT playwright/test/cli/webapp-testing)。LCP / Core Web Vitals / ARIA / 堆快照。
      Provider 说明 (4.32.22 终局): 二选一 — ecc (manifests/optional/ecc.yaml,
      bonus tier; ECC 唯一默认 MCP connector) 或 optional 自装 manifest
      (manifests/optional/chrome-devtools-mcp.yaml, mcp-stdio-add 兜底, 供不装
      ecc 的用户; setup optional offer 可勾选)。双装同名双前缀歧义, doctor
      `ecc` check 会 warn。
      两者都缺 → 本 capability 不可用, 本 trigger 不 fire。这一句从散文变成判据:
      fires_when 第二个 arm `chrome_devtools_available == true` 由
      src/cli/lib/probe-chrome-devtools.ts 实测 (ecc plugin / 官方 plugin /
      stdio mcpServers 三种注册形态), 经 `harnessed facts` 自动填入 (确定性事实,
      不问模型)。probe 抛错 = unknown → 仍算 available (fail-soft; 绝不静默删掉
      已声明的诊断能力, sister src/workflow/skipGate.ts)。
      未 fire 时的开启路径 (二选一): `harnessed install ecc`
      或 `claude mcp add chrome-devtools-mcp` —— 只装其中一个。
    fires_when: "subtask.test_type == 'perf-diagnostic' and chrome_devtools_available == true"
    invokes:
      - capability: chrome-devtools-mcp
