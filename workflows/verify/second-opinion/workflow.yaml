# workflows/verify/second-opinion/workflow.yaml — Phase 54 T2
#
# Stage ④ verify sub-workflow — 跨模型第二意见 (cross-AI peer review)。
#
# 为什么是一个独立 sub 而不是一条建议:
#   `artifacts_expected` 是 leaf phase 级的静态列表 (src/workflow/schema/workflow.ts),
#   `src/checkpoint/evidence.ts` 收集一个 leaf 全部 phase 的声明 —— 没有条件位。把第二
#   意见记录直接声明到某个既有 verify sub 上,就等于**每次 verify 都必交**,判据没命中
#   也卡住;`--force` 随即变成肌肉记忆,门形同虚设。
#
#   本仓表达「条件性要求」的现成惯用法是**条件性 fire 的 sub**:gate 决定 sub 跑不跑,
#   跑了的 sub 必须交它声明的产物。于是零新机制:
#
#     判据命中 ──▶ delegates_to.gate fires ──▶ 本 sub fire ──▶ artifacts_expected 必交
#                                                                │
#                                                          不交 ─┴─ --force
#                                                                │      │
#                                                             阻断    ledger 记
#                                                                     evidence_status: overridden
#     判据未命中 ─▶ gate false ─▶ sub skip ─▶ ledger 记 status: skipped + reason
#
#   跳过因此从隐形变成台账上一行。
#
# Sister refs:
#   - workflows/judgments/stage-routing.yaml verify-second-opinion-orchestration trigger
#   - workflows/capabilities.yaml — codex (第二意见 / cross-AI peer review)
#   - src/cli/facts.ts deriveSecondOpinion — 判据的机械派生 (ORCHESTRATION_SURFACE)
#   - .planning/phases/54-declaration-evaluation-parity/SPEC.md T2/T3

schema_version: harnessed.workflow.v3
workflow: verify-second-opinion
description: |
  Stage ④ 跨模型第二意见。fires_when phase.stage == 'verify' AND requires_second_opinion
  == true —— 后者由 `harnessed facts` 从 `git diff --name-only <last release tag>` 与
  ORCHESTRATION SURFACE 的交集机械派生,不是交给模型的判断题。算不出来时取 false 并显式
  报出原因 (per-turn 断点的 SECOND-OPINION 行),不乱 fire 且不静默。

disciplines_applied: [karpathy, output-style, language, operational, priority, protocols]
tools_available: [codex]

phases:
  - id: 01-second-opinion
    name: 跨模型第二意见 (编排契约改动)
    upstream: gstack
    capability: '{{ capabilities.codex.cmd }}'
    model: sonnet
    gate: judgments.stage-routing.verify-second-opinion-orchestration.fires
    # 交付物即证据。不交 → checkpoint complete fail-closed 阻断;--force → ledger 记
    # evidence_status: overridden (可审计的显式跳过,不是静默放行)。
    artifacts_expected: [second-opinion.md]
