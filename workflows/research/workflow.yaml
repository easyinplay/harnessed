# workflows/research/workflow.yaml — Phase v3.0-3.4 W1 T3.4.W1.1
# (v2 19L → v3 ~25L schema bump per RESEARCH-workflows Area 2 Standalone section)
#
# Standalone Stage ① alternate — 多源调研 Tavily MCP (默认关键词) + Exa MCP (描述式 / 学术)
# + ctx7 CLI (库 API 文档) fan-out + GSD discuss synth aggregate; bundled web-search +
# context7 routing rules (workflows/judgments/web-search-routing.yaml) 机器化 per R20.7 + D-08。
#
# v2 → v3 字段 delta (W1.1 schema bump scope):
#   BUMP `schema_version: harnessed.workflow.v3`              (17th surface — sister Phase 3.3 W0.11)
#   ADD  `disciplines_applied: [6 basename]`                  (D-09 L0 Discipline Substrate)
#   ADD  `tools_available: [tavily-mcp, exa-mcp, ctx7, gsd-discuss-phase]`
#                                                              (D-05 + Contract C1 cross-validate)
#   KEEP phases verbatim (01-fan-out + 02-synth) — phases 内容 reuse v2 SHIPPED
#                                                              (per PLAN L455 "phases 内容 reuse v2")
#
# T2.3 delta: 01-fan-out 拆成 5 条 gated source lane (见 phases 内注记) —
#   web-search-routing.yaml 5 trigger 从运行时孤儿变成真 gate。
#
# Sister refs:
#   - .planning/phase-v3.0-3.2/PLAN.md L450-457 (T3.4.W1.1 spec verbatim)
#   - .planning/phase-v3.0-3.2/RESEARCH-workflows.md § Area 2 Standalone research v3 example
#   - workflows/capabilities.yaml tavily-mcp + exa-mcp + ctx7 + gsd-discuss-phase
#     (Phase 2.3 W0.1 SHIPPED)
#   - workflows/disciplines/{karpathy,output-style,language,operational,priority,protocols}.yaml
#     (Phase 3.3 W0.4 SHIPPED, L0 substrate)
#   - src/workflow/schema/workflow.ts WorkflowSchemaV3 (Phase 3.3 W0.5 SHIPPED 122L)

schema_version: harnessed.workflow.v3
workflow: research
description: |
  Standalone Stage ① alternate — 多源调研 Tavily MCP (默认关键词) + Exa MCP (描述式 /
  学术) + ctx7 CLI (库 API 文档) fan-out + GSD discuss synth aggregate; bundled
  web-search + context7 routing rules 机器化 per R20.7 + D-08。

disciplines_applied: [karpathy, output-style, language, operational, priority, protocols]
tools_available: [tavily-mcp, exa-mcp, ctx7, gsd-discuss-phase]

phases:
  # T2.3 — 01-fan-out 的 generic "按 capability route 触发 source" 注记终于落地:
  # 5 条 source lane 各由 workflows/judgments/web-search-routing.yaml 的一个 trigger
  # gate。之前那 5 个 trigger 是运行时孤儿 (零 gate ref → resolveJudgmentGate 纯 ref
  # 驱动, 文件永不加载求值), ADR-0032:81 描述过这步接线但从未落地。
  # lane 之间互斥 (search_type 单值); 默认 gateContext = keyword → 只 fire tavily lane,
  # 与改动前"01-fan-out 无条件跑一次"行为等价。
  # 全部沿用 defaults.ralph_max_iterations.research.01-fan-out 预算 (同一 fan-out 阶段)。

  # lane 1 (默认) — Tavily MCP 关键词 / 库 API / 新闻时效 / 生产 RAG
  - id: 01-fan-out-tavily-keyword
    upstream: web-search
    model: sonnet
    gate: judgments.web-search-routing.tavily-mcp-default.fires
    max_iterations: '{{ defaults.ralph_max_iterations.research.01-fan-out }}'
    parallelism: judgments.parallelism-gate.subagent-default.fires

  # lane 2 — Exa MCP 覆盖默认: 描述式查询 / 学术论文 (需 EXA_API_KEY, 缺则落 lane 1)
  - id: 01-fan-out-exa-descriptive
    upstream: web-search
    model: sonnet
    gate: judgments.web-search-routing.exa-mcp-descriptive-academic.fires
    max_iterations: '{{ defaults.ralph_max_iterations.research.01-fan-out }}'

  # lane 3 — Tavily 必用: 抓整站 / 站点结构 (crawl / map), Exa 无对等工具
  - id: 01-fan-out-tavily-crawl
    upstream: web-search
    model: sonnet
    gate: judgments.web-search-routing.tavily-crawl-map-site.fires
    max_iterations: '{{ defaults.ralph_max_iterations.research.01-fan-out }}'

  # lane 4 — ctx7 CLI: 库 / API / 框架 / SDK / CLI 工具文档 (prefer over web search)
  - id: 01-fan-out-ctx7-lib-docs
    upstream: ctx7
    model: sonnet
    gate: judgments.web-search-routing.ctx7-lib-docs.fires
    max_iterations: '{{ defaults.ralph_max_iterations.research.01-fan-out }}'

  # lane 5 (永远规则) — 单次轻量查询 (一个明确 URL) 直接 WebFetch, 不走 MCP / CLI
  - id: 01-fan-out-webfetch-url
    upstream: web-search
    model: haiku
    gate: judgments.web-search-routing.webfetch-single-url.fires
    max_iterations: '{{ defaults.ralph_max_iterations.research.01-fan-out }}'

  # 02-synth: GSD discuss synth aggregate — 多源结果 dedup + reconcile + GSD discuss-phase format
  # (无 gate — 无论命中哪条 lane 都要 aggregate)
  - id: 02-synth
    upstream: gsd
    capability: '{{ capabilities.gsd-discuss-phase.cmd }}'
    model: opus
    max_iterations: '{{ defaults.ralph_max_iterations.research.02-synth }}'
