# workflows/task/deliver/workflow.yaml — Phase v3.0-3.4 W0 T3.4.W0.9
# (D-09 + D-10 + D-11 + R20.10 + ADR 0011 SDK wrapper)
#
# Stage ③.d 子任务交付 — completion-gate 保 completion-promise verbatim
# "COMPLETE" (R20.10 + D-10)。Parallelism: subagent
# default fan-out OR Agent Teams 升级 (5 触发 OR-chain per bundled Agent Teams
# routing + D-11)。02-progress-mark: planning-with-files /plan 更新 progress.md 标记完成。
#
# 4.36.0 — 上游 ralph-loop plugin 依赖摘除。完成保证 4.35.0 起完全内置并跑在 harnessed
# 自己的 live path 上:`harnessed checkpoint complete <sub> --result-file <path>`
# (evidence artifacts / TDD boundary / verbatim promise 三重 fail-closed) +
# `harnessed checkpoint fail <sub> --failing-tests <n>` (BUDGET-EXHAUSTED /
# NO-PROGRESS / BREAK-LOOP)。这取代 ADR 0036 的 plugin → /goal → self-loop 三级链
# (该链的存在理由就是 plugin 可用性,依赖摘掉后不再需要)。SDK 路径 (ralphLoopWrap 硬上界,
# harnessed 自有代码) 不变;defaults.ralph_max_iterations 键名沿用不改名 (见 defaults.yaml)。
#
# Brief enforcement (W0.9 spec MUST include):
#   - completion_promise = COMPLETE (R20.10 verbatim acceptance string)
#   - parallelism-gate ref: judgments.parallelism-gate.completion-gate-wrapper.fires
#     (R20.10 正交 wraps subagent-default / agent-teams-upgrade / main-session-fallback)
#   - Agent Teams route conditional via on[] clause when 5 escalation triggers fire
#   - R20.10 explicit max_iterations_exceeded handler:
#     {action: emit_warning_and_halt, message, exit_code: 1} — NOT silent abort
#     (sister Phase 2.4 W1.2 fallbackHandlers.ts engine.ts wire pattern)
#
# Sister refs:
#   - .planning/phase-v3.0-3.2/RESEARCH-workflows.md § Area 2 task/deliver sub yaml example
#   - workflows/judgments/parallelism-gate.yaml triggers.completion-gate-wrapper (Phase 2.3 W0.2 SHIPPED)
#   - workflows/capabilities.yaml completion-gate + agent-teams-{create,send-message,shutdown} +
#     planning-with-files (Phase 2.3 W0.1 + 3.3 W0.2 SHIPPED)
#   - workflows/judgments/parallelism-gate.yaml — 5 升级触发 OR-chain
#     (teammate_send_message_needed / subagent_context_overflow / shared_task_list /
#     opposing_hypothesis_debate / fullstack_three_way)
#   - src/workflow/schema/workflow.ts WorkflowSchemaV3 FallbackMaxIterationsExceeded
#     Type.Literal('emit_warning_and_halt') (Phase 3.3 W0.5 SHIPPED)
#
# disciplines_applied: 6 default 全开 per D-09 L0 Discipline Substrate always-on
# tools_available: 5 entry ∈ capabilities.yaml entry set (T3.3.W0.10 Contract C1 catch)

schema_version: harnessed.workflow.v3
workflow: task-deliver
description: |
  Stage ③.d 子任务交付 — completion-gate 保 completion-promise verbatim
  "COMPLETE" (R20.10 + D-10;harnessed 自有 checkpoint CLI,无上游 plugin)。Parallelism subagent
  default fan-out OR Agent Teams 升级 (5 触发 OR-chain per bundled Agent Teams routing
  + D-11)。R20.10 explicit max_iterations_exceeded handler: emit_warning_and_halt
  exit_code 1 (NOT silent abort, sister Phase 2.4 W1.2 fallbackHandlers.ts engine.ts
  wire pattern)。Cleanup mandatory when Agent Teams escalation path fires (按名请求每个
  teammate shut down per bundled Agent Teams cleanup discipline; 团目录 session 退出自动清理)。

disciplines_applied: [karpathy, output-style, language, operational, priority, protocols]
tools_available:
  - completion-gate
  - verification-before-completion
  - agent-teams-create
  - agent-teams-send-message
  - agent-teams-shutdown
  - planning-with-files

phases:
  # `upstream:` is deliberately ABSENT here (schema: Optional). Every other phase's
  # `upstream:` names the third-party system that supplies the capability
  # (superpowers / planning-with-files / gsd / gstack). This phase's capability is
  # harnessed's own `checkpoint` CLI, so there is no upstream to name — asserting one
  # would be the same false-dependency claim 4.36.0 removes.
  - id: 01-deliver
    name: deliver (completion-gate + Agent Teams conditional escalation)
    capability: '{{ capabilities.completion-gate.cmd }}'
    model: haiku
    args:
      completion_promise: COMPLETE
      max_iterations: '{{ defaults.ralph_max_iterations.task-deliver.01-deliver }}'
    parallelism: judgments.parallelism-gate.completion-gate-wrapper.fires
    on:
      - if: 'subtask.lines >= 20 and subtask.type != "single_command_query"'
        invoke: '{{ capabilities.completion-gate.cmd }}'
      - if: 'subtask.lines < 20 or subtask.type == "single_command_query"'
        action: skip
    fallback:
      max_iterations_exceeded:
        action: emit_warning_and_halt
        message: 'attempt budget exhausted for task-deliver (BUDGET-EXHAUSTED). Sub-task likely incomplete — explicit halt per R20.10 (NOT silent abort).'
        exit_code: 1
    # v3.8.0 P1 — completion-gate COMPLETE + Agent Teams escalation phase, full 3-RULES inject.
    injects_rules: [escalation, transparent-skip, agent-teams-prevention]

  - id: 01b-verify-evidence
    name: verification-before-completion (子任务标 done 前贴验证证据 — evidence before claims)
    upstream: superpowers
    capability: '{{ capabilities.verification-before-completion.cmd }}'
    model: haiku
    # v13.0 P42 — superpowers-native per-claim 证据门; 在 completion-gate COMPLETE (01-deliver)
    # 之后、progress-mark 标记完成之前强制贴验证 output (evidence before claims)。
    artifacts_expected: [verification-evidence.md]

  - id: 02-progress-mark
    name: progress-mark (planning-with-files /plan — mark subtask complete in progress.md)
    upstream: planning-with-files
    capability: '{{ capabilities.planning-with-files.cmd }}'
    invokes: '/plan'
    model: haiku
    artifacts_expected: [progress.md]
