name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Phase 1.1.1 hotfix H1: pin actions to SHA (supply-chain hardening).
      # Tag refs (@v4) are mutable; SHA refs are immutable. Commit SHA below
      # corresponds to v5.0.1 (actions/checkout) and v5.0.0 (actions/setup-node)
      # as of 2026-06-11 (bumped from v4 — Node 20 deprecation, runners force Node 24 by 2026-06-16).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0  # H2: full history + tags needed for ADR 0001/0002 守恒 check below
      # corepack enable BEFORE setup-node: v5 reads package.json `packageManager`
      # (pnpm@...) and fails "Unable to locate executable file: pnpm" when the
      # corepack shim is not yet on PATH (regression vs v4). Re-enabled post-setup below.
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Phase 1.1.1 hotfix H2 + Phase 1.2 H5 + Phase 1.2.5 wedge + Phase 1.3 ADR 0007 errata + Phase 1.4 ADR 0008 errata + Phase 1.5 ADR 0009 errata + Phase 2.1 ADR 0010 errata + Phase 2.2 ADR 0011 errata + Phase 2.3 ADR 0012 errata + Phase 2.4 ADR 0013 errata + Phase 3.1 ADR 0014 errata + Phase 3.2 ADR 0015 errata + Phase 3.3 ADR 0016 errata + Phase 3.4 ADR 0017 errata:
      # A7 acceptance bar enforces ADR 0001-0017 main body 守恒 (unchanged
      # since each adr-NNNN-accepted baseline tag). Any drift fails CI.
      # Phase 1.2.5 加 ADR 0006 (three-stack mechanization wedge); Phase 1.3
      # 加 ADR 0007 (categorization schema errata — manifest 加 3 字段);
      # Phase 1.4 加 ADR 0008 (routing engine v1 errata — phase 1.3 deferred
      # items inline + 接口契约升级跟踪点); Phase 1.5 加 ADR 0009 (routing
      # L2 + engineering 23 招式 errata — D5 三 P1 interface contract delta +
      # DAG + Semantic Router L2 stub + mattpocock_phases schema); Phase 2.1
      # 加 ADR 0010 (installer schema extension errata — license whitelist
      # MIT-0/anthropics-official + license_source audit field + bundle-install
      # provides[] + install_type↔method 1:N enforcement + H3 agentDefinition
      # budget ≤200L errata + H4 substring match known limitation + D-16
      # --header ${ENV_VAR} env-resolution carve-out); Phase 2.2 加 ADR 0011
      # (execute-task workflow + ralph-loop SDK introduction + dual-signal
      # completion 4-layer + per-phase model tier + Wave 0 transparency gate
      # flip + schemaVersion 7-surface + provenance gate hard fail + Task
      # Session 复用 conditional DEFERRED → v0.3.0 — 9 章节 errata 合并);
      # Phase 2.3 加 ADR 0012 (extension category MVP + karpathy SKILL inject
      # 引擎 + EE-5 双层 + CD-3 negative-space + 30-sample routing 100%
      # (≥85% bar 远超) + Wave 0 backlog 6 项一次根治 — 9 章节 errata 合并);
      # Phase 2.4 加 ADR 0013 (doctor MIN 5 check + EE-4 plan-checker 4 维量化
      # SSOT + dashboard C 路径 3 子功能 FULL absorb + README CI counter gate
      # B 路径 + audit 完整版 hard-fail + ralph-loop Win sentinel 5 fixture +
      # Wave 0 backlog 5 项一次根治 — 9 章节 errata 合并, v0.2.0 milestone 末);
      # Phase 3.1 加 ADR 0014 (checkpoint engine + harnessed resume + compact
      # 协议 + T4.4 closure infra activation 闭环 — 9 章节 errata 合并,
      # v0.3.0 milestone 第 1 phase);
      # Phase 3.2 加 ADR 0015 (gstack 前缀探测 + workflow 变量插值 +
      # plan-feature reference 实装 + T4.4 closure infra 二代消费者 闭环 —
      # 9 章节 errata 合并, v0.3.0 milestone 第 2 phase);
      # Phase 3.3 加 ADR 0016 (aliases.yaml RICH 5-field redirect (D-01) +
      # DOCTOR-ONLY-WARN install 安静 + doctor 7th check 人读 audit (D-02) +
      # known-good YAML manifest lazy lock (D-03) + STATE dual-SSOT
      # 5-recurrence terminus COLLAPSE (D-04 (b) LOCKED) + Wave 0 backlog
      # 3 项一次根治 + manifest-domain colocation 3rd consumer 闭环 — 9 章节
      # errata 合并, v0.3.0 milestone 第 3 phase);
      # Phase 3.4 加 ADR 0017 (routing 命中率 ≥ 85% 验收 30/30 = 100% per-tier
      # Sonnet/Haiku/Opus 100/100/100 (D-01 REAL HISTORICAL + D-02 RUN ENGINE
      # per-sample arbitrate dispatch) + check-token-budget.ts 48L PRIMARY
      # helper 4th family member + doctor 8th check DOCTOR-ONLY-WARN
      # status='warn'≠fail (D-03 Buffer.byteLength /4 zero-dep + D-04) +
      # W0.1 STRATEGIC institutionalize 4 D-decisions D1-D4 + W0 backlog
      # 5 项一次根治 — 9 章节 errata 合并, v0.3.0 milestone 第 4 phase
      # CLOSE);
      # baseline tag iterate 扩到 17 个 (1-0016 → 1-0017, Phase 3.4 W2 T2.7 落地
      # per W-02 orchestrator explicit literal `ADR 0001-0017` fix sister
      # Phase 3.3 W2 T2.7 + Phase 3.2 W3 T3.4 + Phase 3.1 W5 T5.4 pattern).
      # Phase 4.3 加 ADR 0018 (routing audit log + R8.4 ADR backfill + v0.4.0 milestone close —
      # 9 章节 errata 合并, v0.4.0 milestone 末);
      # Phase 5.1 加 ADR 0019 0020 0021 (retroactive adr-0019/0020-accepted Phase 5.1 W0 T0.4
      # LOCAL CREATE + adr-0021-accepted Phase 5.1 W2 T2.9 LOCAL CREATE; retroactive iter
      # 0018→0021 per RESEARCH § 5 critical finding absorbed T2.8 CRITICAL fix):
      # Phase v2.0-2.6 W1 ADR 0024-0029 backfill — iter 0023→0029 (6 ADR: workflow schema v2 + capabilities baseline + judgments multi-file + research/verify-work workflows + ralph-loop+TDD+Agent Teams + fallback 3 铁律 + 4-stage 机器化 close).
      # Phase v3.0-3.6 W1 ADR 0030-0032 backfill — iter 0029→0032 (3 ADR: namespace policy bare slash cmd + 4-stage namespace-layered architecture + cross-cutting disciplines + execution mechanism).
      - name: A7 acceptance bar - ADR 0001-0032 main body conservation
        run: node scripts/ci/check-adr-baselines.mjs
      # Phase 2.1 T1.7 — transparency verdict-marker gate (ADR 0010, D2.1-7/8).
      # Scans .planning verdict docs for closure-marker lines missing an N/N
      # ratio + miss: declaration. W3: warn-only round 1 (script exits 0 even
      # on violations); ENFORCE flag flips to true in phase 2.2.
      - name: Transparency verdict-marker gate (warn-only round 1)
        run: node scripts/check-transparency-verdicts.mjs
      # Phase 3.4 W0.1 D3 — STATE.md archive cadence gate (3 rules, warn-only round 1).
      # Sister scripts/check-transparency-verdicts.mjs cadence: ENFORCE=false initial →
      # flip true Phase 3.5 OR v0.4.0 per DEFERRED #AF (sister Phase 2.1 transparency
      # gate W3 warn-only round 1 → Phase 2.2 W0 ENFORCE=true 沿袭). 3 rules: (1)
      # STATE.md size ≤200L round 1 (≤150 v0.4 tighten per DEFERRED #AG); (2) 关键决议
      # ship 总结 section ≤1 occurrence (防 sister review H2 复发); (3) historical
      # W-N errata / sister review M[1-9] 修正 literal 禁字面 (move to RETROSPECTIVE).
      - name: Check STATE.md archive cadence (warn-only round 1)
        run: node scripts/check-state-archive-stale.mjs
      # Phase 2.2 T4.0 — provenance gate (ADR 0011 § 8, B-33+B-34, CD-6 ⭐⭐).
      # Walks .harnessed/{sessions,checkpoints,route-logs}/** — every runtime
      # artifact must have sibling .provenance.json (4 fields per
      # provenance.schema.json). Curated paths (workflows/**, manifest.yaml)
      # NOT in scope per R8.
      - name: Provenance gate (Phase 2.2 W4 hard fail — CD-6)
        run: node scripts/check-provenance.mjs
      # Phase v2.0-2.3 W0 T2.3.W0.6 — workflow schema validate (R20.2 + R20.4).
      # Walks workflows/capabilities.yaml + workflows/judgments/*.yaml against
      # TypeBox schemas (src/workflow/schema/{capabilities,judgment}.ts SSOT;
      # Workflow schema validate moved AFTER pnpm install (v3.3.1 CI hotfix
      # 2026-05-21) — script imports @sinclair/typebox which needs node_modules,
      # sister pattern "EE-4 plan-checker quant gate" L173-177 verbatim。
      # Phase 2.3 Wave 0 T0.6 — Provenance Win pwsh sentinel (T1.3).
      # Phase 1.3.1 F37 路径分隔符踩过坑; Phase 2.2 T4.0 check-provenance.mjs
      # 跑过 4-step synthetic 但 glob .harnessed/{sessions,checkpoints,route-logs}/**
      # 在 Win path-sep 行为未验. 此 step Win-only invoke 走 pwsh shell, 验
      # Win path-sep behavior parity with bash.
      - name: Provenance gate (Win pwsh sentinel, Phase 2.3 Wave 0 T1.3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/check-provenance.mjs
      # Phase 2.3 Wave 0 T0.8 — Deferred items review cadence (T5).
      # 沿袭 transparency gate W3 warn-only round 1 模式 (Phase 2.2 flip ENFORCE=true 前置).
      # D-OOS-1 .omc/ 2026-05-13 → 2026-05-15 三 phase 未 review process bug 根治.
      - name: Deferred items review
        run: node scripts/check-deferred-items.mjs
      # Phase 30 (v10.0) — en↔zh-Hans skill sync-guard (REQ-v100-sync-guard).
      # HARD-FAIL (no continue-on-error) per design doc "hard gate, not advisory".
      # Dep-free pure-node → runs BEFORE pnpm install (sister check-provenance above).
      # drift-only: a SKILL.zh-Hans.md sibling MUST structurally match its SKILL.md
      # (frontmatter keys / {{ capabilities.X }} placeholders / {{ host.* }} primitive
      # set, Phase 65 T12 / heading-level shape);
      # absence of a sibling is OK — green now (0 siblings until Phase 31 lands them).
      - name: Skill i18n parity gate (Phase 30 — en↔zh-Hans structural parity, hard-fail)
        run: node scripts/check-skill-i18n-parity.mjs
      # Phase 61 — declared-but-never-evaluated gate (HARD-FAIL). harnessed's bet is
      # that declarative composition scales better than bespoke imperative
      # installers; the cost it buys is a failure mode the imperative approach
      # cannot have — a declaration nothing evaluates. Thirteen instances were
      # found by hand (docs/comparison.md); this catches the class. Dep-free pure
      # node (fs + regex) → runs BEFORE pnpm install, sister check-provenance.
      - name: Schema consumer gate (Phase 61 — every declared field must be evaluated, hard-fail)
        run: node scripts/check-schema-consumers.mjs
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      # Workflow schema validate — moved here AFTER pnpm install (v3.3.1 CI hotfix
      # 2026-05-21) so @sinclair/typebox import resolves。Hard fail (NOT warn-only) —
      # schema 与 shipped yaml 1:1 对齐 (sister Phase 2.3 W0.6 + Phase 3.3 W0.10 ship).
      - name: Workflow schema validate (v2.0 NEW — T2.3.W0.6)
        run: node scripts/check-workflow-schema.mjs
      # Phase 33 (v10.0) — en↔zh-Hans yaml sync-guard (REQ-v100-yaml-i18n).
      # HARD-FAIL (no continue-on-error). Sister the Phase 30 skill parity gate, but
      # uses the `yaml` package for a robust structural parse → runs AFTER pnpm install
      # (sister check-workflow-schema above), not before. drift-only: a
      # <base>.zh-Hans.yaml sibling MUST structurally match its <base>.yaml (top-level
      # keys / role-key + rule-id sets / per-entry field presence); absence is OK.
      - name: Yaml i18n parity gate (Phase 33 — role-prompts + disciplines en↔zh-Hans, hard-fail)
        run: node scripts/check-yaml-i18n-parity.mjs
      # Phase 55 — upstream_health freshness gate (HARD-FAIL).
      # `spec.upstream_health` was a required schema block with zero consumers, so
      # its dates and versions rotted silently while still reading as current facts
      # (Phase 54's declaration-without-evaluation family, 4th surface). This gate
      # fails when a THIRD-PARTY manifest's last_check is >90d old; first-party
      # manifests (upstream repository == this repo) are exempt. Zero network by
      # design — an upstream release must NOT turn CI red, since nearly every
      # install cmd resolves @latest. Uses the `yaml` package → runs AFTER pnpm
      # install (sister check-yaml-i18n-parity above).
      - name: Upstream health freshness gate (Phase 55 — last_check ≤90d, hard-fail)
        run: node scripts/check-upstream-freshness.mjs
      # Phase 65 (v16.0) T11 — host-primitive residue gate (HARD-FAIL).
      # Phase 65 rewrote Claude-Code wording in the workflow prose into
      # `{{ host.* }}` placeholders so a codex install names codex primitives. This
      # gate keeps the codex half honest: it renders every SKILL{,.zh-Hans}.md and
      # the field-selected runtime-prompt yaml FOR codex (capabilities pass then
      # host pass, exactly as the installer does) and fails on any surviving CC
      # token outside the allowlist. Asserts on the RENDERED artifact, never the
      # source — source prose is supposed to be full of placeholders. Uses the
      # `yaml` package → runs AFTER pnpm install (sister check-upstream-freshness).
      - name: Host-primitive residue gate (Phase 65 T11 — zero CC tokens in the codex render, hard-fail)
        run: node scripts/check-host-primitives.mjs
      # Phase 2.4 W6 T6.2 — EE-4 plan-checker quantitative gate (B-11 + B-12 + D-02).
      # Walker scripts/run-plan-checker.mjs (T2.2 f986d42) consumes T2.1 schema
      # routing/plan-review-schema.yaml; BLOCKER (<=2/4 dims) -> exit 1 + ::error::
      # annotation; manual /gsd-plan-phase rerun required (B-12, NOT auto-spawn).
      # Hard only for the active phase and plan files changed by this PR/push;
      # archived historical plans remain evidence, not mutable CI scope.
      - name: EE-4 plan-checker quant gate
        env:
          PLAN_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/run-plan-checker.mjs --ci
      - run: corepack pnpm typecheck
      - name: Hard lint (zero unbaselined warnings)
        run: node scripts/ci/check-biome.mjs
      # Phase 3.4 CI hotfix (2026-05-17) — build BEFORE test so dist/cli.mjs
      # exists for integration tests added at Phase 3.3 W2 T2.3 (commit 245955b):
      # install-aliases / install-known-good / install-silent-redirect all spawn
      # `node dist/cli.mjs`. Pre-hotfix: 3-OS test step failed `Cannot find
      # module dist/cli.mjs` because build was sequenced AFTER test.
      - run: corepack pnpm build
      - run: corepack pnpm test:coverage
      - name: Installation documentation contracts
        run: node --test tests/docs/install-channels.contract.mjs

      - run: corepack pnpm build:schema
      # Phase 2.3 Wave 0 T0.4 — M1 schema regen drift gate (Phase 2.2 RETROSPECTIVE
      # Lesson 6 自我建议落地). Catches spec.ts → schemas/manifest.v1.schema.json
      # drift (Phase 2.1 → Phase 2.2 hygiene commit 18150a5 precedent).
      - name: Schema regen gate (Phase 2.3 Wave 0 M1)
        run: |
          git diff --exit-code schemas/ || {
            echo "::error::schemas/ drift detected — run 'corepack pnpm build:schema' locally and commit"
            exit 1
          }
      - run: corepack pnpm build:hooks
      # architecture review #5 — hook regen drift gate. bin/*.mjs are esbuild
      # bundles of src/checkpoint/*Main.ts (single source), committed like schemas/.
      # esbuild output is deterministic for the pinned version, so a mismatch means
      # someone edited the TS without regenerating (the drift the codegen prevents).
      - name: Hook regen gate (architecture review #5)
        run: |
          git diff --exit-code bin/ || {
            echo "::error::bin/ hook drift detected — run 'corepack pnpm build:hooks' locally and commit"
            exit 1
          }
      # 4.31.0 eval Slice A (T6) — orchestrator-behavior regression trap suite.
      # Single-ubuntu by CEO-plan ruling: the runner is pure in-process (golden
      # paths normalized cross-platform); Windows/macOS engine surface is already
      # covered by the unit matrix above. Sequencing: `pnpm build` ran at the top
      # of this job — eval executes the dist artifact (production truth, OV4).
      - name: eval trap suite (4.31.0 Slice A)
        run: node dist/cli.mjs eval --dir fixtures/eval
      # Phase 2.3 Wave 0 T0.5 — schemaVersion consumer call site gate (T1.2).
      # B1 plan-check fix (≥7 → ≥2 honest baseline) — Phase 2.2 W2 schemaVersion
      # 实际 helper-only adoption; ≥2 反映当前 grep -r "branchOnSchemaVersion" src/
      # = src/types/schemaVersion.ts (定义+self-ref). Phase 2.3+ 逐步扩 consumer per
      # surface (handoff doc / phases-yaml / manifest state / installer state /
      # route decision log / checkpoint / agent definition factory). 详 ADR 0012 § 7.
      - name: schemaVersion consumer gate (Phase 2.3 Wave 0 T1.2)
        run: |
          count=$(grep -r "branchOnSchemaVersion" src/ | wc -l | tr -d ' ')
          if [ "$count" -lt 2 ]; then
            echo "::error::expected >= 2 branchOnSchemaVersion call sites (Phase 2.2 W2 helper-only adoption baseline; Phase 2.3+ expands per surface — see ADR 0012 § 7 errata), found $count"
            exit 1
          fi
      - run: corepack pnpm validate:schema
      - run: node ./dist/cli.mjs --version
      # Phase 1.2 T5.5 — installer integration (H4 dual-layer):
      #   Layer 1 — mock claude CLI shim PATH-injected: lets mcp-stdio-add
      #     installer reach diff-render without "claude: command not found"
      #     on bare CI runners (no real claude install required).
      #   Layer 2 — real spawn ctx7 + gsd (npm-cli, claude-CLI-independent)
      #     dry-run: exercises npmCli installer end-to-end against real npm
      #     binaries the runner already ships. Tmpdir + npm_config_prefix
      #     isolate any global state changes from the runner's home dir.
      # Win edge: Git Bash on windows-latest sees `mock-bin/claude` (no .exe)
      # and tries to invoke it via cmd.exe; we use bash-shebang shim + chmod
      # +x which Git Bash handles via shebang routing. This pattern is
      # validated in phase 1.1.1 H4 sister review.
      - name: Installer integration (H4 dual-layer — mock shim + real npm-cli dry-run)
        env:
          npm_config_prefix: ${{ runner.temp }}/npm-prefix
        shell: bash
        run: |
          # CLI exit-code map (per cli/install.ts):
          #   0 = ok (apply succeeded)
          #   1 = error
          #   2 = aborted / dry-run sentinel / level-flag-missing
          # Dry-run runs ALWAYS exit 2 (the "aborted: user-cancel" dry-run
          # sentinel from npmCli.ts L97 + mcpStdioAdd.ts L153). We accept
          # exit 2 here as a successful dry-run; only exit 1 (error) fails CI.
          ok_or_dryrun() {
            local cmd="$1"
            shift
            # GHA bash default = `-e -o pipefail`. Pipefail makes the pipeline
            # exit non-0 if `$cmd` exits non-0 (even when tee exits 0), which
            # then triggers `-e` and kills the step before we can inspect
            # ${PIPESTATUS[0]}. Disable pipefail just around this pipe so the
            # pipeline's exit code = tee's (always 0); we read ${PIPESTATUS[0]}
            # explicitly to honor the dry-run exit-2 sentinel. (Phase 1.2.1 hotfix.)
            set +o pipefail
            "$cmd" "$@" 2>&1 | tee out.log
            local rc=${PIPESTATUS[0]}
            set -o pipefail
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then return 0; fi
            echo "::error::installer command exited $rc (expected 0 or 2)"
            return 1
          }

          mkdir -p "$npm_config_prefix"
          # H4 layer 1 — mock claude CLI shim on PATH (no real claude needed)
          chmod +x scripts/ci/mock-claude-cli.sh
          mkdir -p "${{ runner.temp }}/mock-bin"
          cp scripts/ci/mock-claude-cli.sh "${{ runner.temp }}/mock-bin/claude"
          export PATH="${{ runner.temp }}/mock-bin:$PATH"

          # H4 layer 1 — mcp-stdio-add dry-run: shim must be reachable; diff
          # output must mention ~/.claude.json (v3.0.2 --scope user 后写入位置) +
          # the manifest name.
          # 4.32.22 — exa-mcp dry-run cell restored (manifests/tools/exa-mcp.yaml
          # is back as a base component; reverts the 4.32.21 removal).
          ok_or_dryrun node ./dist/cli.mjs install tavily-mcp --dry-run --non-interactive
          grep -q "tavily-mcp" out.log
          grep -q ".claude.json" out.log
          ok_or_dryrun node ./dist/cli.mjs install exa-mcp --dry-run --non-interactive
          grep -q "exa-mcp" out.log

          # H4 layer 2 — real spawn npm-cli (no claude CLI dep) dry-run.
          # ctx7 + gsd both declare `npm install -g` (L4); --system flag
          # required to pass confirmAt() level gate; --dry-run still
          # short-circuits before any global-PATH mutation.
          ok_or_dryrun node ./dist/cli.mjs install ctx7 --dry-run --non-interactive --system
          ok_or_dryrun node ./dist/cli.mjs install gsd --dry-run --non-interactive --system

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm test
      - name: Installation documentation contracts
        run: node --test tests/docs/install-channels.contract.mjs
      - name: ralph-loop Win sentinel
        if: runner.os == 'Windows'
        run: corepack pnpm exec vitest run tests/workflow/ralph-loop-win-sentinel.test.ts

  # B2 (v4.20.0) — bun-compile 单文件二进制冒烟(task_plan _phase-b2-compile-pipeline)。
  # 独立 job(不阻塞 test 主 job 的失败归因):3-OS 原生编译(交叉编译 --target 未实测,
  # D4 锁定不作为 CI 路径)→ 异地 cwd 冒烟:--version 断言 + setup --dry-run 34 workflows
  # (资产解包全链路:entry 首跑解包 → getAssetsRoot compiled 分支 → readdir)。
  # doctor 不作断言(runner 环境差异:jq/bash flavor 等 check 与二进制机制无关)。
  binary-smoke:
    name: binary-smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # SHA pin 同仓库 H1 惯例;对应 oven-sh/setup-bun v2.2.0 (2026-07 解析)。
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: bun scripts/build-binary.mjs
      - name: Runtime channel and owned hook contracts
        run: |
          BIN=$(ls dist-bin/harnessed-* | grep -v '\.sha256$')
          node scripts/runtime-channel-smoke.mjs --node-cli dist/cli.mjs --binary "$BIN" --bun "$(bun -p 'process.execPath')"
      - name: smoke — version + asset unpack + 34 workflows from a foreign cwd
        run: |
          # 4.27.0 — dist-bin now also carries <asset>.sha256; the smoke wants the exe only.
          BIN=$(ls dist-bin/harnessed-* | grep -v '\.sha256$')
          VER=$(node -p "require('./package.json').version")
          SMOKE_DIR=$(mktemp -d)
          cp "$BIN" "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          EXE=$(ls harnessed-*)
          chmod +x "$EXE" 2>/dev/null || true
          out=$("./$EXE" --version)
          [ "$out" = "$VER" ] || { echo "::error::--version '$out' != '$VER'"; exit 1; }
          count=$("./$EXE" setup --dry-run 2>/dev/null | grep -c "  →  ")
          # Phase 80 — 34 after the conditional plan workflows landed.
          [ "$count" -eq 34 ] || { echo "::error::expected 34 workflows in dry-run, got $count"; exit 1; }
          # 二次运行不得重复解包(stderr 无 unpacked 行 — 幂等)。
          second=$("./$EXE" --version 2>&1 >/dev/null || true)
          case "$second" in *unpacked*) echo "::error::second run re-unpacked assets (idempotency broken)"; exit 1;; esac
          echo "binary-smoke ✅ $EXE v$VER (34 workflows, idempotent unpack)"
      # 4.27.0 (B3 T6 / OV3 用户裁决) — update rehearsal on the REAL compiled
      # product, 3-OS: covers Bun-runtime rename/EPERM/spawn semantics and a
      # genuine Windows PE smoke that fixture unit tests cannot fake. Zero
      # network: HARNESSED_UPDATE_SOURCE_DIR is the same seam the unit tests
      # inject. dry-run must write nothing; the real swap must leave a working
      # binary + the bin-backup rollback net.
      - name: smoke — update dry-run + local-source swap rehearsal
        run: |
          BIN=$(ls dist-bin/harnessed-* | grep -v '\.sha256$')
          VER=$(node -p "require('./package.json').version")
          R_DIR=$(mktemp -d)
          SRC_DIR=$(mktemp -d)
          cp "$BIN" "$R_DIR/"
          cp "$BIN" "$SRC_DIR/"
          cp "$BIN.sha256" "$SRC_DIR/"
          cd "$R_DIR"
          EXE=$(ls harnessed-*)
          chmod +x "$EXE" 2>/dev/null || true
          # dry-run: step preview, zero writes
          out=$(HARNESSED_UPDATE_SOURCE_DIR="$SRC_DIR" "./$EXE" update --dry-run)
          case "$out" in *sha256*) ;; *) echo "::error::dry-run preview missing sha256 step"; echo "$out"; exit 1;; esac
          ls | grep -q '\.bak-' && { echo "::error::dry-run created a .bak"; exit 1; }
          ls | grep -q '\.harnessed-update-' && { echo "::error::dry-run left a temp file"; exit 1; }
          # real swap rehearsal (same version — the source-dir seam skips the compare)
          HARNESSED_UPDATE_SOURCE_DIR="$SRC_DIR" "./$EXE" update
          newv=$("./$EXE" --version)
          [ "$newv" = "$VER" ] || { echo "::error::post-swap --version '$newv' != '$VER'"; exit 1; }
          [ -d "$HOME/.claude/harnessed/bin-backup/$VER" ] || { echo "::error::bin-backup rollback net missing"; exit 1; }
          echo "update-rehearsal ✅ $EXE v$VER (dry-run clean + swap + rollback net)"

  # 4.28.0 (B3 Slice 2) — one-line installer rehearsal on the REAL compiled
  # product, 3-OS. HARNESSED_INSTALLER_SOURCE_DIR is the zero-network seam
  # (same philosophy as HARNESSED_UPDATE_SOURCE_DIR above). Asserts: binary
  # lands in ~/.harnessed/bin, --version matches, and the PATH guidance is
  # printed (runners never have that dir on PATH; Windows CI is
  # non-interactive so the consent prompt must NOT fire).
  installer-smoke:
    name: installer-smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: corepack pnpm install --frozen-lockfile
      - run: bun scripts/build-binary.mjs
      - name: installer rehearsal (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh
          VER=$(node -p "require('./package.json').version")
          out=$(HARNESSED_INSTALLER_SOURCE_DIR="$PWD/dist-bin" bash install.sh)
          echo "$out"
          BIN="$HOME/.local/bin/harnessed"
          [ -x "$BIN" ] || { echo "::error::binary not installed at $BIN"; exit 1; }
          v=$("$BIN" --version)
          [ "$v" = "$VER" ] || { echo "::error::installed --version '$v' != '$VER'"; exit 1; }
          # PATH outcome is environment-dependent: runners already have ~/.local/bin
          # on PATH (installer prints "already on your PATH" — the designed
          # zero-friction path), dev boxes may not (installer prints the export
          # snippet). Either is correct; assert one of them appeared.
          case "$out" in *"export PATH="*|*"already on your PATH"*) ;; *) echo "::error::PATH guidance missing from installer output"; exit 1;; esac
          echo "installer-smoke ✅ unix v$VER"
      - name: installer rehearsal (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HARNESSED_INSTALLER_SOURCE_DIR = "$PWD\dist-bin"
          $out = pwsh -NoProfile -File install.ps1
          $out | Write-Host
          $ver = node -p "require('./package.json').version"
          $bin = Join-Path $env:LOCALAPPDATA 'harnessed\bin\harnessed.exe'
          if (-not (Test-Path $bin)) { Write-Host '::error::binary not installed'; exit 1 }
          $v = & $bin --version
          if ($v -ne $ver) { Write-Host "::error::installed --version '$v' != '$ver'"; exit 1 }
          if (-not (($out | Out-String) -match 'SetEnvironmentVariable|already on your PATH')) { Write-Host '::error::PATH guidance missing'; exit 1 }
          Write-Host "installer-smoke OK windows v$ver"
